name: CodeQL

# Static security analysis of the TypeScript and of these workflows. Findings
# appear under Security → Code scanning. If GitHub's "default setup" for
# CodeQL is turned on in the repository settings, turn it off: the two
# can't run side by side.

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [main, dev]
    schedule:
        # Weekly, to catch newly published queries against unchanged code.
        - cron: "27 4 * * 1"
    workflow_dispatch:

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript, actions]
        steps:
            - uses: actions/checkout@v7

            # Both languages are analysed from source, so nothing needs building.
            - uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: security-extended

            - uses: github/codeql-action/analyze@v4
              with:
                  category: /language:${{ matrix.language }}
