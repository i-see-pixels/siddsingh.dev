name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `biome ci` never writes and reports problems as PR annotations.
      - name: Lint and format
        run: pnpm exec biome ci

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build prerenders published posts, so it reads the database. Point
      # this secret at a Neon branch made for CI, not production.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        if: env.DATABASE_URL != ''
        run: pnpm build

      # Pull requests from forks get no secrets; lint and typecheck still ran.
      - name: Skip build without a database
        if: env.DATABASE_URL == ''
        run: echo "::notice::DATABASE_URL is not set, so the build was skipped."
