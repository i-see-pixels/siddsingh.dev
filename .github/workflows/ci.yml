name: CI

on:
    pull_request:
    push:
        branches: [main, dev]
    workflow_dispatch:

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NEXT_TELEMETRY_DISABLED: 1

jobs:
    check:
        name: Lint and typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            # Reads the pnpm version from "packageManager" in package.json.
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # `biome ci` never writes and reports problems as PR annotations.
            - name: Lint and format
              run: pnpm exec biome ci

            - name: Typecheck
              run: pnpm typecheck

    build:
        name: Build
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # The build prerenders published posts, so it reads the database. Point
            # this secret at a Neon branch made for CI, not production.
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build
              if: env.DATABASE_URL != ''
              run: pnpm build

            # Pull requests from forks get no secrets; lint and typecheck still ran.
            - name: Skip build without a database
              if: env.DATABASE_URL == ''
              run: echo "::notice::DATABASE_URL is not set, so the build was skipped."
