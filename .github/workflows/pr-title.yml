name: PR title

# The release workflow picks the version bump from the PR title, so titles must
# be Conventional Commits: "feat: …", "fix(blog): …", "feat!: …".

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::Start the PR title with a Conventional Commit type, e.g. \"feat: add tag pages\", \"fix(blog): broken RSS dates\" or \"feat!: drop the v1 API\"."
            exit 1
          fi
